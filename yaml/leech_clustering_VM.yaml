#cloud-config

package_update: true

packages:
  - git
  - python3
  - python3-venv
  - python3-pip

runcmd:
  - - bash
    - -lc
    - |
      set -e
      cd /home/ubuntu
      git clone https://github.com/NeverConvex/anki_leech_clustering anki_leech_clustering
      chown -R ubuntu:ubuntu /home/ubuntu/anki_leech_clustering
      runuser -u ubuntu -- python3 -m venv /home/ubuntu/anki_leech_clustering/.venv
      runuser -u ubuntu -- /home/ubuntu/anki_leech_clustering/.venv/bin/python -m pip install --upgrade pip
      runuser -u ubuntu -- /home/ubuntu/anki_leech_clustering/.venv/bin/python -m pip install -r /home/ubuntu/anki_leech_clustering/anki_leech_clustering_requirements.txt
